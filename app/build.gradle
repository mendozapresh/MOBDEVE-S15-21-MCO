plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

android { namespace 'com.steadyme.app'; compileSdk 35
    defaultConfig { applicationId 'com.mobdeve.s15.esquillo.faith.mobdeve_mco3_new'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
    buildFeatures { viewBinding true; buildConfig true }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation platform('com.google.firebase:firebase-bom:33.3.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
